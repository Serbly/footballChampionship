<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Standings</title>
    <link rel="stylesheet" th:href="@{/css/public-pages.css}">
</head>
<body>
<div class="container">
    <h2 th:text="'Championship: ' + ${championship.name}"></h2>

    <form method="get" th:action="@{/standings/{id}(id=${championship.id})}">
        <label for="season">Select season:</label>
        <select id="season" name="season" class="form-select d-inline w-auto">
            <option th:each="s : ${seasons}" th:value="${s}" th:text="${s}"
                    th:selected="${s == selectedSeason}"></option>
        </select>
        <button type="submit" class="btn btn-sm btn-dark">View</button>
    </form>


    <h3>Standings (Season: <span th:text="${selectedSeason}"></span>)</h3>
    <table>
        <tr><th>Team</th><th>M</th><th>W</th><th>D</th><th>L</th><th>P</th></tr>
        <tr th:each="s : ${standings}">
            <td>
                <a th:href="@{/team/{id}(id=${s.team.id}, season=${selectedSeason})}"
                   th:text="${s.team.name}"></a>
            </td>
            <td th:text="${s.matchesPlayed}"></td>
            <td th:text="${s.wins}"></td>
            <td th:text="${s.draws}"></td>
            <td th:text="${s.losses}"></td>
            <td th:text="${s.points}"></td>
        </tr>
    </table>

    <h3>Top scorers</h3>
    <table>
        <tr><th>Player</th><th>Team</th><th>Goals</th></tr>
        <tr th:each="row : ${topScorers}">
            <td th:text="${row[0]}"></td>
            <td th:text="${row[1]}"></td>
            <td th:text="${row[2]}"></td>
        </tr>
    </table>

    <h4>Выгрузить отчёт:</h4>
    <a th:href="@{/report/excel/{id}(id=${championship.id}, season=${selectedSeason})}">Excel</a>
    <a th:href="@{/report/pdf/{id}(id=${championship.id}, season=${selectedSeason})}">PDF</a>
    <br>
    <a href="/">Back</a>
</div>
</body>
</html>
