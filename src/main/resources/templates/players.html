<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Игроки</title></head>
<body>
<h2>Список игроков</h2>
<table border="1">
    <tr><th>Имя</th><th>Позиция</th><th>Команда</th></tr>
    <tr th:each="p : ${players}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.position}"></td>
        <td th:text="${p.team.name}"></td>
    </tr>
</table>
</body>
</html>
