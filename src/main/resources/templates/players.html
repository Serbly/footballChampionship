<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Players</title></head>
<body>
<h2>Players</h2>
<table border="1">
    <tr><th>Name</th><th>Position</th><th>Team</th><th>Number</th><th>Nationality</th><th>Birthdate</th></tr>
    <tr th:each="p : ${players}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.position}"></td>
        <td th:text="${p.team.name}"></td>
        <td th:text="${p.number}"></td>
        <td th:text="${p.nationality}"></td>
        <td th:text="${p.birthdate}"></td>
    </tr>
</table>
<a href="/">Back</a>
</body>
</html>
