<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Coaches</title></head>
<body>
<h2>Coaches</h2>
<table border="1">
    <tr><th>Name</th><th>Nationality</th><th>Birthdate</th></tr>
    <tr th:each="c : ${coaches}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.nationality}"></td>
        <td th:text="${c.birthdate}"></td>
    </tr>
</table>
<a href="/">Back</a>
</body>
</html>
