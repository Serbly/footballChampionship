<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Тренеры</title></head>
<body>
<h2>Список тренеров</h2>
<table border="1">
    <tr><th>Имя</th><th>Команда</th></tr>
    <tr th:each="c : ${coaches}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.team.name}"></td>
    </tr>
</table>
</body>
</html>
