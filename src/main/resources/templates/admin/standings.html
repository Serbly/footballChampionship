<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Standings Management</title>
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<h1>Standings Management</h1>

<div class="card">
    <table>
        <thead>
        <tr>
            <th>Championship</th>
            <th>Team</th>
            <th>Matches played</th>
            <th>Wins</th>
            <th>Draws</th>
            <th>Losses</th>
            <th>Points</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="standing : ${standings}">
            <td th:text="${standing.championship.name + '(' + standing.championship.season + ')'}"></td>
            <td th:text="${standing.team.name}"></td>
            <td th:text="${standing.matchesPlayed}"></td>
            <td th:text="${standing.wins}"></td>
            <td th:text="${standing.draws}"></td>
            <td th:text="${standing.losses}"></td>
            <td th:text="${standing.points}"></td>
            <td>
                <a th:href="@{'/admin/standings/edit/' + ${standing.id}}" class="btn btn-edit">Edit</a>
                <form th:action="@{'/admin/standings/delete/' + ${standing.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-delete" onclick="return confirm('Are you sure?');">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="bts">
    <a href="/admin/standings/add" class="btn btn-add">Add Standing</a>
    <a href="/admin/dashboard" class="btn btn-back">Back to Dashboard</a>
</div>
</body>
</html>
