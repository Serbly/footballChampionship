<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Team</title></head>
<body>
<h1>Edit Team</h1>
<form th:action="@{/admin/teams/edit}" th:object="${team}" method="post">
    <input type="hidden" th:field="*{id}" />
    <label>Name:</label>
    <input type="text" th:field="*{name}" /><br>
    <label>City:</label>
    <input type="text" th:field="*{city}" /><br>
    <label>Stadium:</label>
    <input type="text" th:field="*{stadium}" /><br>
    <label>Coach:</label>
    <select th:field="*{coach}">
        <option th:each="coach : ${coaches}" th:value="${coach}" th:text="${coach.name}"></option>
    </select><br>
    <button type="submit">Save</button>
    <a href="/admin/teams">Cancel</a>
</form>
</body>
</html>
