<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Team</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Edit Team</h1>
        <form th:action="@{/admin/teams/edit}" th:object="${team}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div>
                <label>Name:</label>
                <input type="text" th:field="*{name}" />
            </div>
            <div>
                <label>City:</label>
                <input type="text" th:field="*{city}" />
            </div>
            <div>
                <label>Stadium:</label>
                <input type="text" th:field="*{stadium}" />
            </div>
            <div>
                <label>Coach:</label>
                <select th:field="*{coach.id}">
                    <option th:each="coach : ${coaches}" th:value="${coach.id}" th:text="${coach.name}"></option>
                </select>
            </div>
            <button type="submit">Save</button>
            <a href="/admin/teams">Cancel</a>
        </form>
    </div>
</body>
</html>
