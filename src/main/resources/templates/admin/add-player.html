<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Добавить игрока</title></head>
<body>
<h2>Добавление игрока</h2>
<form th:action="@{/admin/players/save}" th:object="${player}" method="post">
  <label>Имя: <input type="text" th:field="*{name}" required /></label><br>
  <label>Позиция: <input type="text" th:field="*{position}" required /></label><br>
  <label>Команда:
    <select th:field="*{team.id}">
      <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
    </select>
  </label><br>
  <button type="submit">Сохранить</button>
</form>
<a href="/admin/players">Назад</a>
</body>
</html>
