<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Championship</title></head>
<body>
<h1>Edit Championship</h1>
<form th:action="@{/admin/championships/edit}" th:object="${championship}" method="post">
  <input type="hidden" th:field="*{id}" />
  <label>Name:</label>
  <input type="text" th:field="*{name}" />
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div><br>
  <label>Season:</label>
  <input type="text" th:field="*{season}" />
  <div th:if="${#fields.hasErrors('season')}" th:errors="*{season}"></div><br>
  <button type="submit">Save</button>
  <a href="/admin/championships">Cancel</a>
</form>
</body>
</html>
