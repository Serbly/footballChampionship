<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Championship</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Championship</h2>

    <form th:action="@{/admin/championships/edit}" th:object="${championship}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Name:</label>
        <input type="text" th:field="*{name}" class="form-control mb-3"/>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>

        <label>Season:</label>
        <input type="text" th:field="*{season}" class="form-control mb-3"/>
        <div th:if="${#fields.hasErrors('season')}" th:errors="*{season}" class="text-danger"></div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/admin/championships" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
