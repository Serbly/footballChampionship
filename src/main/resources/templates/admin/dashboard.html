<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">⚙️ Admin Panel</a>
        <a class="btn btn-outline-light ms-auto" href="/" role="button">🏠 Back to Main</a>
    </div>
</nav>

<div class="container flex-grow-1">
    <h2 class="text-center mb-4">Administrator Dashboard</h2>
    <p class="text-center">Select a section to manage:</p>

    <div class="list-group">
        <a href="/admin/teams" class="list-group-item list-group-item-action">Manage Teams</a>
        <a href="/admin/players" class="list-group-item list-group-item-action">Manage Players</a>
        <a href="/admin/coaches" class="list-group-item list-group-item-action">Manage Coaches</a>
        <a href="/admin/matches" class="list-group-item list-group-item-action">Manage Matches</a>
        <a href="/admin/championships" class="list-group-item list-group-item-action">Manage Championships</a>
        <a href="/admin/standings" class="list-group-item list-group-item-action">Manage Standings</a>
        <a href="/admin/goals" class="list-group-item list-group-item-action">Manage Goals</a>
    </div>
</div>

<footer class="bg-light text-center text-muted py-3 mt-auto">
    <hr class="m-0">
    <p class="mb-0">&copy; 2025 Football App</p>
</footer>

</body>
</html>
