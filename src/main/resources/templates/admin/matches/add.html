<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Match</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4 text-center">Add Match</h1>

    <form th:action="@{/admin/matches/add}" th:object="${match}" method="post">

        <label for="championship">Championship:</label>
        <select id="championship" th:field="*{championship.id}" class="form-control mb-3">
            <option th:each="championship : ${championships}"
                    th:value="${championship.id}"
                    th:text="${championship.name}"></option>
        </select>

        <label for="homeTeam">Home Team:</label>
        <select id="homeTeam" th:field="*{homeTeam.id}" class="form-control mb-3" onchange="updateStadium(this)">
            <option th:each="team : ${teams}"
                    th:value="${team.id}"
                    th:text="${team.name}"
                    th:data-stadium="${team.stadium}"></option>
        </select>

        <label for="awayTeam">Away Team:</label>
        <select id="awayTeam" th:field="*{awayTeam.id}" class="form-control mb-3">
            <option th:each="team : ${teams}"
                    th:value="${team.id}"
                    th:text="${team.name}"></option>
        </select>

        <label for="date">Date:</label>
        <input type="date" id="date" th:field="*{date}" class="form-control mb-3"/>

        <label for="score">Score:</label>
        <input type="text" id="score" th:field="*{score}" class="form-control mb-3"/>

        <label for="stadium">Stadium:</label>
        <input type="text" id="stadium" th:field="*{stadium}" class="form-control mb-3" readonly/>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <div class="mt-3">
        <a href="/admin/matches" class="btn btn-secondary">Back</a>
    </div>
</div>

<script>
    function updateStadium(select) {
        const selectedOption = select.options[select.selectedIndex];
        const stadium = selectedOption.getAttribute('data-stadium');
        document.getElementById('stadium').value = stadium || '';
    }

    // Автоматическое обновление при первой загрузке (если выбран homeTeam)
    window.onload = function () {
        const homeTeamSelect = document.getElementById('homeTeam');
        if (homeTeamSelect) updateStadium(homeTeamSelect);
    }
</script>

</body>
</html>
