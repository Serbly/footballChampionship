<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Match</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Add Match</h1>
        <form th:action="@{/admin/matches/add}" th:object="${match}" method="post">
            <div>
                <label for="championship">Championship:</label>
                <select id="championship" th:field="*{championship.id}">
                    <option th:each="championship : ${championships}"
                            th:value="${championship.id}"
                            th:text="${championship.name} + '(' + ${championship.season} + ')'"></option>
                </select>
            </div>
            <div>
                <label for="homeTeam">Home Team:</label>
                <select id="homeTeam" th:field="*{homeTeam.id}" onchange="updateStadium(this)">
                    <option th:each="team : ${teams}"
                            th:value="${team.id}"
                            th:text="${team.name}"
                            th:data-stadium="${team.stadium}"></option>
                </select>
            </div>
            <div>
                <label for="awayTeam">Away Team:</label>
                <select id="awayTeam" th:field="*{awayTeam.id}">
                    <option th:each="team : ${teams}"
                            th:value="${team.id}"
                            th:text="${team.name}"></option>
                </select>
            </div>
            <div>
                <label for="date">Date:</label>
                <input type="date" id="date" th:field="*{date}"/>

            </div>
            <div>
                <label for="score">Score:</label>
                <input type="text" id="score" th:field="*{score}"/>
            </div>
            <div>
                <label for="stadium">Stadium:</label>
                <input type="text" id="stadium" th:field="*{stadium}" readonly/>
            </div>
            <button type="submit">Save</button>
            <a href="/admin/matches">Back</a>
        </form>
    </div>

    <script>
        function updateStadium(select) {
            const selectedOption = select.options[select.selectedIndex];
            const stadium = selectedOption.getAttribute('data-stadium');
            document.getElementById('stadium').value = stadium || '';
        }

        window.onload = function () {
            const homeTeamSelect = document.getElementById('homeTeam');
            if (homeTeamSelect) updateStadium(homeTeamSelect);
        }
    </script>
</body>
</html>
