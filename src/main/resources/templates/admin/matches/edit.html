<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Match</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4 text-center">Edit Match</h1>

    <form th:action="@{/admin/matches/edit}" th:object="${match}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="championship">Championship:</label>
        <select id="championship" th:field="*{championship.id}" class="form-control mb-3" required>
            <option th:each="champ : ${championships}" th:value="${champ.id}" th:text="${champ.name}"></option>
        </select>

        <label for="homeTeam">Home Team:</label>
        <select id="homeTeam" th:field="*{homeTeam.id}" class="form-control mb-3" required onchange="updateStadium(this)">
            <option th:each="team : ${teams}"
                    th:value="${team.id}"
                    th:text="${team.name}"
                    th:data-stadium="${team.stadium}"
                    th:selected="${match.homeTeam.id == team.id}"></option>
        </select>

        <label for="awayTeam">Away Team:</label>
        <select id="awayTeam" th:field="*{awayTeam.id}" class="form-control mb-3" required>
            <option th:each="team : ${teams}"
                    th:value="${team.id}"
                    th:text="${team.name}"
                    th:selected="${match.awayTeam.id == team.id}"></option>
        </select>

        <label for="date">Date:</label>
        <input type="datetime-local" id="date" th:field="*{date}" class="form-control mb-3"/>

        <label for="score">Score:</label>
        <input type="text" id="score" th:field="*{score}" class="form-control mb-3"/>

        <label for="stadium">Stadium:</label>
        <input type="text" id="stadium" th:field="*{stadium}" class="form-control mb-3" readonly/>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/admin/matches" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>

<script>
    function updateStadium(select) {
        const selectedOption = select.options[select.selectedIndex];
        const stadium = selectedOption.getAttribute('data-stadium');
        document.getElementById('stadium').value = stadium || '';
    }

    // Установить стадион при загрузке страницы
    window.onload = function () {
        const homeTeamSelect = document.getElementById('homeTeam');
        if (homeTeamSelect) updateStadium(homeTeamSelect);
    }
</script>

</body>
</html>
