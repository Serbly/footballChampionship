<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Match</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Edit Match</h1>
        <form th:action="@{/admin/matches/edit}" th:object="${match}" method="post">
            <input type="hidden" th:field="*{id}" />
            <label for="championship">Championship:</label>
                <select id="championship" th:field="*{championship.id}" required>
                    <option th:each="champ : ${championships}" th:value="${champ.id}" th:text="${champ.name}"></option>
                </select>
            <label for="homeTeam">Home Team:</label>
                <select id="homeTeam" th:field="*{homeTeam.id}" required onchange="updateStadium(this)">
                    <option th:each="team : ${teams}"
                            th:value="${team.id}"
                            th:text="${team.name}"
                            th:data-stadium="${team.stadium}"
                            th:selected="${match.homeTeam.id == team.id}"></option>
                </select>
            <label for="awayTeam">Away Team:</label>
                <select id="awayTeam" th:field="*{awayTeam.id}" required>
                    <option th:each="team : ${teams}"
                            th:value="${team.id}"
                            th:text="${team.name}"
                            th:selected="${match.awayTeam.id == team.id}"></option>
                </select>
            <label for="date">Date:</label>
                <input type="date" id="date" th:field="*{date}"/>
            <label for="score">Score:</label>
                <input type="text" id="score" th:field="*{score}"/>
            <label for="stadium">Stadium:</label>
                <input type="text" id="stadium" th:field="*{stadium}" readonly/>
            <button type="submit">Save</button>
            <a href="/admin/matches">Cancel</a>
        </form>
    </div>

    <script>
        function updateStadium(select) {
            const selectedOption = select.options[select.selectedIndex];
            const stadium = selectedOption.getAttribute('data-stadium');
            document.getElementById('stadium').value = stadium || '';
        }

        window.onload = function () {
            const homeTeamSelect = document.getElementById('homeTeam');
            if (homeTeamSelect) updateStadium(homeTeamSelect);
        }
    </script>
</body>
</html>
