<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Standing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Add Standing</h1>
        <form th:action="@{/admin/standings/add}" th:object="${standing}" method="post">
            <div>
                <label>Championship:</label>
                <select th:field="*{championship.id}">
                    <option th:each="championship : ${championships}" th:value="${championship.id}" th:text="${championship.name + '(' + championship.season + ')'}"></option>
                </select>
                <div th:if="${#fields.hasErrors('championship')}" th:errors="*{championship}"></div>
            </div>
            <div>
                <label>Team:</label>
                <select th:field="*{team.id}">
                    <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
                </select>
                <div th:if="${#fields.hasErrors('team')}" th:errors="*{team}"></div>
            </div>
            <div>
                <label>Matches Played:</label>
                <input type="number" th:field="*{matchesPlayed}" />
                <div th:if="${#fields.hasErrors('matchesPlayed')}" th:errors="*{matchesPlayed}"></div>
            </div>
            <div>
                <label>Wins:</label>
                <input type="number" th:field="*{wins}" />
                <div th:if="${#fields.hasErrors('wins')}" th:errors="*{wins}"></div>
            </div>
            <div>
                <label>Draws:</label>
                <input type="number" th:field="*{draws}" />
                <div th:if="${#fields.hasErrors('draws')}" th:errors="*{draws}"></div>
            </div>
            <div>
                <label>Losses:</label>
                <input type="number" th:field="*{losses}" />
                <div th:if="${#fields.hasErrors('losses')}" th:errors="*{losses}"></div>
            </div>
            <div>
                <label>Points:</label>
                <input type="number" th:field="*{points}" />
                <div th:if="${#fields.hasErrors('points')}" th:errors="*{points}"></div>
            </div>
            <button type="submit">Save</button>
            <a href="/admin/standings">Back</a>
        </form>
    </div>
</body>
</html>
