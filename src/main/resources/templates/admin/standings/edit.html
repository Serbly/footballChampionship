<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Standing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
  <div>
    <h1>Edit Standing</h1>
    <form th:action="@{/admin/standings/edit}" th:object="${standing}" method="post">
      <input type="hidden" th:field="*{id}" />
      <div>
        <label>Championship:</label>
        <select th:field="*{championship}">
          <option th:each="championship : ${championships}" th:value="${championship.id}" th:text="${championship.name + '(' + championship.season + ')'}"></option>
        </select>
      </div>
      <div>
        <label>Team:</label>
        <select th:field="*{team}">
          <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
        </select>
      </div>
      <div>
        <label>Matches Played:</label>
        <input type="number" th:field="*{matchesPlayed}" />
      </div>
      <div>
        <label>Wins:</label>
        <input type="number" th:field="*{wins}" />
      </div>
      <div>
        <label>Draws:</label>
        <input type="number" th:field="*{draws}" />
      </div>
      <div>
        <label>Losses:</label>
        <input type="number" th:field="*{losses}" />
      </div>
      <div>
        <label>Points:</label>
        <input type="number" th:field="*{points}" />
      </div>
      <button type="submit">Save</button>
      <a href="/admin/standings">Cancel</a>
    </form>
  </div>
</body>
</html>
