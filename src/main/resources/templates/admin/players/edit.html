<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Edit Player</h1>
        <form th:action="@{/admin/players/edit}" th:object="${player}" method="post">
            <input type="hidden" th:field="*{id}" />
            <label>Name:</label>
                <input type="text" th:field="*{name}" /><br>
            <label>Number:</label>
                <input type="number" th:field="*{number}" /><br>
            <label>Position:</label>
                <input type="text" th:field="*{position}" /><br>
            <label>Team:</label>
                <select th:field="*{team.id}">
                <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
                </select><br>
            <label>Nationality:</label>
                <input type="text" th:field="*{nationality}" /><br>
            <label>Birthdate:</label>
                <input type="date" th:field="*{birthdate}" /><br>
            <button type="submit">Save</button>
            <a href="/admin/players">Cancel</a>
        </form>
    </div>
</body>
</html>
