<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Add Player</h1>
        <form th:action="@{/admin/players/add}" th:object="${player}" method="post">
            <div>
                <label>Name:</label>
                <input type="text" th:field="*{name}" />
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div>
                <label>Number:</label>
                <input type="number" th:field="*{number}" />
                <div th:if="${#fields.hasErrors('number')}" th:errors="*{number}"></div>
            </div>
            <div>
                <label>Position:</label>
                <input type="text" th:field="*{position}" />
                <div th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
            </div>
            <div>
                <label>Team:</label>
                <select th:field="*{team.id}">
                    <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
                </select>
                <div th:if="${#fields.hasErrors('team')}" th:errors="*{team}"></div>
            </div>
            <div>
                <label>Nationality:</label>
                <input type="text" th:field="*{nationality}" />
                <div th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
            </div>
            <div>
                <label>Birthdate:</label>
                <input type="date" th:field="*{birthdate}" />
                <div th:if="${#fields.hasErrors('birthdate')}" th:errors="*{birthdate}"></div>
            </div>
            <button type="submit">Save</button>
            <a href="/admin/players">Back</a>
        </form>
    </div>
</body>
</html>
