<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Добавить матч</title></head>
<body>
<h2>Добавление матча</h2>
<form th:action="@{/admin/matches/save}" th:object="${match}" method="post">
  <label>Дата: <input type="date" th:field="*{date}" required /></label><br>
  <label>Хозяева:
    <select th:field="*{homeTeam.id}">
      <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
    </select>
  </label><br>
  <label>Гости:
    <select th:field="*{awayTeam.id}">
      <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
    </select>
  </label><br>
  <label>Счёт хозяев: <input type="number" th:field="*{homeScore}" /></label><br>
  <label>Счёт гостей: <input type="number" th:field="*{awayScore}" /></label><br>
  <button type="submit">Сохранить</button>
</form>
<a href="/admin/matches">Назад</a>
</body>
</html>
