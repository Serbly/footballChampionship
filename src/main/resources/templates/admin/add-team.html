<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Добавить команду</title></head>
<body>
<h2>Добавление команды</h2>
<form th:action="@{/admin/teams/save}" th:object="${team}" method="post">
  <label>Название команды: <input type="text" th:field="*{name}" required /></label><br>
  <label>Город: <input type="text" th:field="*{city}" required /></label><br>
  <button type="submit">Сохранить</button>
</form>
<a href="/admin/teams">Назад</a>
</body>
</html>
