<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Добавить тренера</title></head>
<body>
<h2>Добавление тренера</h2>
<form th:action="@{/admin/coaches/save}" th:object="${coach}" method="post">
    <label>Имя: <input type="text" th:field="*{name}" required /></label><br>
    <label>Команда:
        <select th:field="*{team.id}">
            <option th:each="team : ${teams}" th:value="${team.id}" th:text="${team.name}"></option>
        </select>
    </label><br>
    <button type="submit">Сохранить</button>
</form>
<a href="/admin/coaches">Назад</a>
</body>
</html>
