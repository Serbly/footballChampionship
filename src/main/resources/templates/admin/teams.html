<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teams</title>
</head>
<body>
<h1>Team Management</h1>
<table border="1">
    <tr>
        <th>Name</th>
        <th>City</th>
        <th>Stadium</th>
        <th>Coach</th>
        <th>Actions</th>
    </tr>
    <tr th:each="team : ${teams}">
        <td th:text="${team.name}">Team Name</td>
        <td th:text="${team.city}">City</td>
        <td th:text="${team.stadium}">Stadium</td>
        <td th:text="${team.coach.name}">Coach</td>
        <td>
            <a th:href="@{'/admin/teams/edit/' + ${team.id}}">Edit</a>
            <form th:action="@{'/admin/teams/delete/' + ${team.id}}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Are you sure?');">Delete</button>
            </form>
        </td>
    </tr>
</table>
<a href="/admin/teams/add">Add Team</a> |
<a href="/admin/dashboard">Back to Dashboard</a>
</body>
</html>
