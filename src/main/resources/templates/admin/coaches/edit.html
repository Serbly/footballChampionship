<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Coach</title></head>
<body>
<h1>Edit Coach</h1>
<form th:action="@{/admin/coaches/edit}" th:object="${coach}" method="post">
    <input type="hidden" th:field="*{id}" />
    <label>Name:</label>
    <input type="text" th:field="*{name}" /><br>
    <label>Nationality:</label>
    <input type="text" th:field="*{nationality}" /><br>
    <label>Birthdate:</label>
    <input type="date" th:field="*{birthdate}" /><br>
    <button type="submit">Save</button>
    <a href="/admin/coaches">Cancel</a>
</form>
</body>
</html>
