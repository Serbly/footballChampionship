<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Coach</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Edit Coach</h1>
    <form th:action="@{/admin/coaches/edit}" th:object="${coach}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Name:</label>
        <input type="text" th:field="*{name}" class="form-control mb-3"/>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        <br>
        <label>Nationality:</label>
        <input type="text" th:field="*{nationality}" class="form-control mb-3"/>
        <div th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}" class="text-danger"></div>
        <br>
        <label>Birthdate:</label>
        <input type="date" th:field="*{birthdate}" class="form-control mb-3"/>
        <div th:if="${#fields.hasErrors('birthdate')}" th:errors="*{birthdate}" class="text-danger"></div>
        <br>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/admin/coaches" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
</body>
</html>
