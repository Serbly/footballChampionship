<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Coach</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
    <div>
        <h1>Add Coach</h1>
        <form th:action="@{/admin/coaches/add}" th:object="${coach}" method="post">
            <label>Name:</label>
                <input type="text" th:field="*{name}"/>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                <br>
            <label>Nationality:</label>
                <input type="text" th:field="*{nationality}"/>
                <div th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}" class="text-danger"></div>
                <br>
            <label>Birthdate:</label>
                <input type="date" th:field="*{birthdate}"/>
                <div th:if="${#fields.hasErrors('birthdate')}" th:errors="*{birthdate}" class="text-danger"></div>
                <br>
            <button type="submit">Save</button>
            <a href="/admin/coaches">Back</a>
        </form>
    </div>
</body>
</html>
