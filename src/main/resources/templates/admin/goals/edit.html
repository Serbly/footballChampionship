<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Goal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div>
  <h1>Edit Goal</h1>
  <form th:action="@{/admin/goals/edit}" th:object="${goal}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div>
      <label>Championship:</label>
      <select id="championshipSelect" name="championship.id" class="form-select" onchange="filterMatches()">
        <option value="">-- Select --</option>
        <option th:each="c : ${championships}"
                th:value="${c.id}"
                th:data-name="${c.name}"
                th:data-season="${c.season}"
                th:text="${c.name + ' (' + c.season + ')'}"
                th:selected="${goal.championship.id == c.id}">
        </option>
      </select>
    </div>

    <div>
      <label>Match:</label>
      <select id="matchSelect" th:field="*{match.id}" class="form-select">
        <option th:each="m : ${matches}"
                th:value="${m.id}"
                th:data-champ-id="${m.championship.id}"
                th:text="${m.homeTeam.name + ' : ' + m.awayTeam.name}"
                th:selected="${goal.match.id == m.id}">
        </option>
      </select>
      <div th:if="${#fields.hasErrors('match')}" th:errors="*{match}"></div>
    </div>

    <div>
      <label>Player:</label>
      <select th:field="*{player.id}" class="form-select">
        <option th:each="player : ${players}"
                th:value="${player.id}"
                th:text="${player.name}"
                th:selected="${goal.player.id == player.id}">
        </option>
      </select>
      <div th:if="${#fields.hasErrors('player')}" th:errors="*{player}"></div>
    </div>

    <div>
      <label>Minute:</label>
      <input type="number" th:field="*{minute}" class="form-control" />
      <div th:if="${#fields.hasErrors('minute')}" th:errors="*{minute}"></div>
    </div>

    <div>
      <label>Type:</label>
      <input type="text" th:field="*{type}" class="form-control" />
      <div th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Save</button>
    <a href="/admin/goals" class="btn btn-secondary mt-3">Cancel</a>
  </form>
</div>

<script>
  function filterMatches() {
    const selectedChampId = document.getElementById('championshipSelect').value;
    const matchSelect = document.getElementById('matchSelect');

    Array.from(matchSelect.options).forEach(option => {
      const matchChampId = option.getAttribute('data-champ-id');
      option.hidden = !(matchChampId === selectedChampId);
    });

    // если текущий выбранный матч скрыт, сбрасываем выбор
    const selectedOption = matchSelect.options[matchSelect.selectedIndex];
    if (selectedOption.hidden) {
      matchSelect.selectedIndex = 0;
    }
  }

  // Автоматическая фильтрация при загрузке страницы
  window.onload = filterMatches;
</script>
</body>
</html>
