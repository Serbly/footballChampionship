<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Goals</title></head>
<body>
<h1>Goal Management</h1>
<table border="1">
    <tr><th>Match</th><th>Player</th><th>Minute</th><th>Type</th><th>Actions</th></tr>
    <tr th:each="goal : ${goals}">
        <td th:text="${goal.match.homeTeam.name} + ':' + ${goal.match.awayTeam.name}">Match</td>
        <td th:text="${goal.player.name}">Player</td>
        <td th:text="${goal.minute}">Minute</td>
        <td th:text="${goal.type}">Type</td>
        <td>
            <a th:href="@{'/admin/goals/edit/' + ${goal.id}}">Edit</a>
            <form th:action="@{'/admin/goals/delete/' + ${goal.id}}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Are you sure?');">Delete</button>
            </form>
        </td>
    </tr>
</table>
<a href="/admin/goals/add">Add Goal</a> |
<a href="/admin/dashboard">Back to Dashboard</a>
</body>
</html>
