<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Match</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h2 th:text="${match.homeTeam.name + ':' + match.awayTeam.name}"></h2>
<p>
    Дата: <span th:text="${match.date}"></span><br>
    Счёт: <span th:text="${match.score}"></span>
</p>

<h3>Goals</h3>
<ul>
    <li th:each="g : ${match.goals}" th:text="${g.minute + ' мин - ' + g.player.name + ' (' + g.type + ')'}"></li>
</ul>

<a href="javascript:history.back()">Back</a>
</body>
</html>
