<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Матчи</title>
</head>
<body>
<h2>Матчи</h2>
<table border="1">
    <tr>
        <th>Чемпионат</th>
        <th>Дата</th>
        <th>Хозяева</th>
        <th>Гости</th>
        <th>Стадион</th>
        <th>Счет</th>
    </tr>
    <tr th:each="match : ${matches}">
        <td th:text="${match.championship}"></td>
        <td th:text="${match.date}"></td>
        <td th:text="${match.homeTeam}"></td>
        <td th:text="${match.awayTeam}"></td>
        <td th:text="${match.stadium}"></td>
        <td th:text="${match.score}"></td>
    </tr>
</table>
<a href="/">Back to main menu</a>
</body>
</html>
