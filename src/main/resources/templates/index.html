<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:fragment="title">Football Championships</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav>
    <a class="logo" href="#">Championships</a>
    <a th:href="@{/login}">Log in</a>
</nav>

<main>
    <h2>Select championship</h2>

    <div class="list-group">
        <a th:each="c : ${championships}"
           th:href="@{/standings/{id}(id=${c.id})}"
           th:text="${c.name}"
           class="list-group-item list-group-item-action">
        </a>
    </div>
</main>

<footer>
    <p class="copy"></p>
</footer>

<script>
    const date = new Date()
    const year = date.getFullYear()
    const pEl = document.querySelector('.copy')
    pEl.textContent = `© ${year} Football App`
</script>
</body>
</html>
