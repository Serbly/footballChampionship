<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:fragment="title">Football Championships</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🏆 Championships</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light" th:href="@{/login}">Log in</a>
        </div>
    </div>
</nav>

<div class="container flex-grow-1">
    <h2 class="text-center mb-4">Select championship</h2>

    <div class="list-group">
        <a th:each="c : ${championships}"
           th:href="@{/standings/{id}(id=${c.id})}"
           th:text="${c.name + ' (' + c.season + ')'}"
           class="list-group-item list-group-item-action">
        </a>
    </div>
</div>

<footer class="bg-light text-center text-muted py-3 mt-auto">
    <hr class="m-0">
    <p class="mb-0">&copy; 2025 Football App</p>
</footer>

</body>
</html>
