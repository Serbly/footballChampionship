<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Football Championships</title>
</head>
<body>
<h1>Select championship:</h1>
<ul>
    <li th:each="c : ${championships}">
        <form th:action="@{/standings/{id}(id=${c.id})}" method="get">
            <button type="submit" th:text="${c.name}"></button>
        </form>
    </li>
</ul>
<a th:href="@{/login}">Log in</a>
</body>
</html>
