<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Championships</title></head>
<body>
<h2>Championships</h2>
<table border="1">
    <tr><th>Name</th><th>Season</th></tr>
    <tr th:each="c : ${championships}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.season}"></td>
    </tr>
</table>
<a href="/">Back</a>
</body>
</html>
