<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${team.name} + ' — season ' + ${season}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h2 th:text="${team.name} + ' (' + ${team.city} + ')'"></h2>
<h3 th:text="'Season: ' + ${season}"></h3>

<h3>Players</h3>
<table border="1">
    <tr><th>Name</th><th>Position</th><th>Nationality</th><th>Age</th></tr>
    <tr th:each="p : ${players}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.position}"></td>
        <td th:text="${p.nationality}"></td>
        <td th:text="${T(java.time.Period).between(p.birthdate, T(java.time.LocalDate).now()).getYears()}"></td>
    </tr>
</table>


<h3>Matches</h3>
<table border="1">
    <tr><th>Date</th><th>Match</th><th>Score</th><th>Stadium</th></tr>
    <tr th:each="m : ${matches}">
        <td th:text="${m.date}"></td>
        <td>
            <a th:href="@{/match/{id}(id=${m.id})}" th:text="${m.homeTeam.name} + ':' + ${m.awayTeam.name}"></a>
        </td>
        <td th:text="${m.score}"></td>
        <td th:text="${m.stadium}"></td>
    </tr>
</table>

<a href="javascript:history.back()">Back</a>
</body>
</html>
