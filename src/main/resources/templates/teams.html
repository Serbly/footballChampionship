<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${team.name} + ' — season ' + ${season}"></title></head>
<body>
<h2 th:text="${team.name} + ' (' + team.city + ')'"></h2>
<h3 th:text="'Season: ' + ${season}"></h3>

<h3>Players</h3>
<ul>
    <li th:each="p : ${players}" th:text="${p.name} + ' — ' + {$p.position} + ' — ' + ${p.number}"></li>
</ul>

<h3>Matches</h3>
<table border="1">
    <tr><th>Date</th><th>Match</th><th>Score</th></tr>
    <tr th:each="m : ${matches}">
        <td th:text="${m.date}"></td>
        <td th:text="${m.homeTeam.name} + ':' + ${m.awayTeam.name}"></td>
        <td th:text="${m.score}"></td>
    </tr>
</table>

<a href="/" th:href="@{/}">Back</a>
</body>
</html>
